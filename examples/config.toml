baseURL = "https://example.org/"
title = "My Blog"
theme = "chicken"
languageCode = "en"

disableKinds = ["taxonomy", "term"]

[minify]
  minifyOutput = true

[permalinks]
  blog = "/:title/"

[params]
  description = "A minimal blog powered by the Chicken theme."
  rssUrl = "/rss"
  # Footer links (omit to hide)
  about = "/about/"
  contact = "/contact/"
  #cv = "/cv/"
  now = "/now/"

[params.author]
  name = "Jane Doe"
  email = "jane@example.org"

[outputs]
  home     = ["HTML"]
  section  = ["HTML", "RSS"]

[outputFormats]
[outputFormats.RSS]
mediatype = "application/rss+xml"
baseName = "rss"
